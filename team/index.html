<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1d20">
<meta name="format-detection" content="telephone=no">
<title>cancha</title>
<link rel="icon" href="img/mirentor-symbol-dark.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/geist-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body class="bare">

<!-- Icons in the keypoint style: a line drawing with one tracked joint. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-today" viewBox="0 0 24 24"><path d="M12 20V5"/><circle class="j" cx="12" cy="19.5" r="1.9"/><circle class="j" cx="12" cy="14.5" r="1.9"/><circle class="j" cx="12" cy="9.5" r="1.9"/><circle class="j" cx="12" cy="4.5" r="1.9"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><path d="M4 7h14M4 12h10M4 17h6"/><circle class="j" cx="18.5" cy="7" r="1.9"/><circle class="j" cx="14.5" cy="12" r="1.9"/><circle class="j" cx="10.5" cy="17" r="1.9"/></symbol>
  <symbol id="i-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5c1.2-3.6 3.6-5.3 6.5-5.3s5.3 1.7 6.5 5.3"/><circle class="j" cx="5.5" cy="19.5" r="1.9"/><circle class="j" cx="18.5" cy="19.5" r="1.9"/></symbol>
  <symbol id="i-team" viewBox="0 0 24 24"><path d="M4 19V9M12 19V5M20 19v-7"/><circle class="j" cx="4" cy="8.5" r="1.9"/><circle class="j" cx="12" cy="4.5" r="1.9"/><circle class="j" cx="20" cy="11.5" r="1.9"/></symbol>
  <symbol id="i-needs" viewBox="0 0 24 24"><path d="M5 6h14v12H5z"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/><circle class="j" cx="15.5" cy="9.6" r="1.9"/></symbol>
  <symbol id="i-reps" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.9-3.2 3-4.7 5.5-4.7s4.6 1.5 5.5 4.7M16 5.6a3 3 0 0 1 0 5.8M17.5 14.6c1.6.6 2.6 2 3.1 4.4"/><circle class="j" cx="9" cy="8.5" r="1.7"/></symbol>
  <symbol id="i-go" viewBox="0 0 24 24"><path d="M4 12h12.5"/><path d="M12 7l5 5-5 5"/><circle class="j" cx="19.6" cy="12" r="1.9"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-talk" viewBox="0 0 24 24"><path d="M5 20V5h9v15M3 20h13"/><path d="M17.5 8h3.5M17.5 11.5h2.5"/><circle class="j" cx="11" cy="12.5" r="1.7"/></symbol>
  <symbol id="i-absent" viewBox="0 0 24 24"><path d="M5 20V5h9v15M3 20h13"/><path d="M17.5 8.5l3.5 3.5M21 8.5L17.5 12"/><circle class="j" cx="11" cy="12.5" r="1.7"/></symbol>
  <symbol id="i-call" viewBox="0 0 24 24"><path d="M7 4h3l1.4 4-1.9 1.4a10.5 10.5 0 0 0 5.1 5.1L16 12.6l4 1.4v3a2 2 0 0 1-2 2A15 15 0 0 1 5 6a2 2 0 0 1 2-2z"/><circle class="j" cx="18" cy="6" r="1.7"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M5 6h14v9h-8.5L6 18.5V15H5z"/><circle class="j" cx="12" cy="10.5" r="1.7"/></symbol>
  <symbol id="i-meeting" viewBox="0 0 24 24"><path d="M5 7h14v12H5zM5 11h14M9 5v3M15 5v3"/><circle class="j" cx="12" cy="15" r="1.7"/></symbol>
  <symbol id="i-contract" viewBox="0 0 24 24"><path d="M7 4h7l4 4v12H7zM14 4v4h4"/><path d="M9.5 15.5c1.4-2 2.3 1.4 3.7 0 .9-.9 1.3-.6 2.3-.2"/><circle class="j" cx="16.4" cy="15.2" r="1.7"/></symbol>
  <symbol id="i-noanswer" viewBox="0 0 24 24"><path d="M7 4h3l1.4 4-1.9 1.4a10.5 10.5 0 0 0 5.1 5.1L16 12.6l4 1.4v3a2 2 0 0 1-2 2A15 15 0 0 1 5 6a2 2 0 0 1 2-2z"/><path d="M15.5 4.5l4 4M19.5 4.5l-4 4"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="M19 6H5v9h3v3.5L12.5 15H19z"/><path d="M9 10.5h6"/><circle class="j" cx="9" cy="10.5" r="1.7"/></symbol>
  <symbol id="i-baddata" viewBox="0 0 24 24"><path d="M12 4l9 15H3z"/><path d="M12 10v4"/><circle class="j" cx="12" cy="16.6" r="1.5"/></symbol>
  <symbol id="i-week" viewBox="0 0 24 24"><path d="M12 20.5 6.2 10.2M12 20.5V5M12 20.5l5.8-10.3"/><circle class="j" cx="6.2" cy="9.6" r="1.9"/><circle class="j" cx="12" cy="4.4" r="1.9"/><circle class="j" cx="17.8" cy="9.6" r="1.9"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/><circle class="j" cx="18.5" cy="12" r="1.7"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5.5v13M15.5 5.5v13"/></symbol>
  <symbol id="i-clap" viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0 0V5a1.5 1.5 0 0 1 3 0v6m0 0V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a5.5 5.5 0 0 1-4.6-2.5L3.6 14a1.4 1.4 0 0 1 2.3-1.6L8 15"/><circle class="j" cx="12.5" cy="3.4" r="1.6"/></symbol>
</svg>

<div class="stage">
<main class="app" id="app">
  <header class="top">
    <a class="brand" href="./" id="home" data-t-aria="top.home.aria"><img src="img/mirentor-symbol-dark.svg" alt="" width="26" height="26"><span id="brandName">cancha</span></a>
    <div class="top-r">
      <button class="chip" type="button" id="queueChip" hidden><i class="dot"></i><span id="queueN"></span></button>
      <button class="chip" type="button" id="streakChip" hidden><i class="dot"></i><span data-t="top.streak"></span> <b class="num" id="streakN"></b></button>
      <button class="chip num" type="button" id="ptsChip" hidden><i class="dot"></i><b id="ptsN"></b> <span data-t="u.pts"></span></button>
      <div class="seg lang" role="group" id="langSeg" data-t-aria="top.lang.aria"><button type="button" data-lang="es" aria-pressed="true">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
      <button class="mebtn" type="button" id="meBtn" hidden data-t-aria="nav.profile"><span id="meLens"></span></button>
    </div>
  </header>
  <div class="asbar" id="asBar" hidden><span id="asText"></span><a class="mini-btn" id="asExit" href="./" data-t="top.viewAs.exit"></a></div>

  <section class="screen" id="s-boot"><div class="boot" role="status"><i></i><span class="vh" data-t="c.loading"></span></div></section>

  <!-- THE GATE. The board has no sign-in of its own: its door is the sales portal's Google sign-in, shown at this same
       address to whoever has no session. This screen is the little the board says itself: the account is not on the
       team, the session ended and coming back did not help, or the app did not load. -->
  <section class="screen" id="s-gate" hidden aria-labelledby="gateGiant">
    <div class="scope vfbox" aria-hidden="true"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <svg viewBox="0 0 132 132" focusable="false"><circle class="disc" cx="66" cy="66" r="50"/><g class="seek"><circle class="a" cx="66" cy="66" r="58"/><circle class="tipj" cx="76.07" cy="123.12" r="4.6"/></g></svg>
      <img src="img/mirentor-symbol-dark.svg" alt="" width="44" height="44"></div>
    <p class="lead" id="gateLead"></p>
    <h1 class="giant" id="gateGiant"></h1>
    <p class="support" id="gateSupport"></p>
    <p class="gate-acts"><a class="btn primary wide" id="gateGo"></a><a class="btn wide" id="gateAlt" hidden></a></p>
  </section>

  <!-- HOY. The day is a route of four stops; the one the day stands on fills the stage. -->
  <section class="screen zone z-hoy" id="s-today" hidden aria-labelledby="todayGiant">
    <p class="zname" aria-hidden="true" data-t="nav.today"></p>
    <div class="hoy-head">
      <div class="hud-row"><span class="chip"><i class="dot"></i><span id="dateChip"></span></span><button class="chip" type="button" id="placeChip" hidden><span class="pc-full" id="placeChipT"></span><span class="pc-short" id="placeChipS"></span></button><span class="chip ghost" id="sampleChip" hidden data-t="c.sample"></span></div>
      <p class="lead" id="todayLead"></p>
      <h1 class="giant" id="todayGiant"></h1>
      <p class="support" id="todaySupport" hidden></p>
    </div>
    <div class="stopstage" id="stopStage">
      <i class="pool" aria-hidden="true"></i>
      <span class="motes" id="motes" aria-hidden="true"></span>
      <span class="tilt"><span class="dio" id="dio" role="img"></span></span>
      <svg class="burst" id="burst" viewBox="0 0 100 100" aria-hidden="true" focusable="false"></svg>
      <span class="chip stopchip" id="stopChip"><i class="dot"></i><span id="stopChipT"></span></span>
    </div>
    <div class="stopcopy" id="stopCopy"><h2 id="stopTitle"></h2><p id="stopSub"></p></div>
    <button class="cta" type="button" id="nextBtn" hidden><span id="nextText"></span><span class="pay"><b class="num" id="nextPts"></b><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-go"/></svg></span></button>
    <div class="route" id="route" role="group" data-t-aria="habits.aria"></div>
    <section class="card" id="closeCard" hidden aria-labelledby="closeH">
      <h2 id="closeH"></h2>
      <p id="closeP"></p>
      <button class="btn" type="button" id="closeBtn"></button>
    </section>
  </section>

  <!-- SEMANA. The week is a hand whose joints are lights; under it, what the week has brought. -->
  <section class="screen zone z-week" id="s-week" hidden aria-labelledby="weekGiant">
    <p class="zname" aria-hidden="true" data-t="nav.week"></p>
    <p class="lead" id="weekLead"></p>
    <h1 class="giant" id="weekGiant"></h1>
    <p class="support" id="weekSupport"></p>
    <figure class="handcard">
      <span class="teachsteps" id="teachSteps" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div class="ahand" id="hand" role="group" data-t-aria="hand.aria"></div>
      <figcaption class="handfoot"><span id="handCap" aria-live="polite"></span><button class="teach" type="button" id="teachBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-play"/></svg><span id="teachT"></span></button></figcaption>
    </figure>
    <ul class="legend" id="legend" data-t-aria="legend.aria"></ul>
    <p class="tier" id="goalBox"><span id="goalText"></span> <button class="link" type="button" id="goalBtn" data-t="c.change"></button></p>
    <div class="sec sec-results">
      <h2 class="sec-h" data-t="week.results"></h2>
      <div class="results" id="results"></div>
    </div>
    <div class="sec sec-chart">
      <h2 class="sec-h" data-t="week.points"></h2>
      <div class="chart"><p class="total"><button class="src num" type="button" id="weekPts"></button> <span data-t="week.points.unit"></span></p><ul class="bars" id="bars"></ul><div class="dayrow" id="dayRow" aria-hidden="true"></div></div>
      <p class="note"><button class="link" type="button" data-open="rulesSheet" data-t="profile.rules"></button></p>
    </div>
  </section>

  <!-- EQUIPO. The team's shared number first, as a staircase everybody climbs; then the table; then the field. -->
  <section class="screen zone z-team" id="s-table" hidden aria-labelledby="goalGiant">
    <p class="zname" aria-hidden="true" data-t="nav.table"></p>
    <div class="eq-head">
      <div class="hud-row"><span class="chip"><i class="dot"></i><span id="weekChip"></span></span></div>
      <p class="lead" data-t="team.title"></p>
      <h1 class="giant" id="goalGiant"></h1>
      <p class="support" id="goalSupport"></p>
    </div>
    <div class="climb" id="climb" aria-hidden="true"><i class="base"></i><i class="glow"></i><i class="crewshadow"></i><span class="crew" id="crew"></span></div>
    <div class="sec sec-table">
      <div class="rowhead"><h2 class="sec-h" data-t="table.title"></h2>
        <div class="seg" role="group" id="tableSeg" data-t-aria="table.period.aria">
          <button type="button" data-period="week" aria-pressed="true" data-t="table.week"></button><button type="button" data-period="day" aria-pressed="false" data-t="table.day"></button><button type="button" data-period="month" aria-pressed="false" data-t="table.month"></button>
        </div>
      </div>
      <p class="label" id="tableLead"></p>
      <p class="giant mid" id="tableGiant"></p>
      <p class="support" id="tableSupport"></p>
      <span class="rs-days" id="rsDays" hidden></span>
      <div class="squad" id="squad" role="group" data-t-aria="squad.aria"></div>
      <ol class="tower" id="tableRows"></ol>
      <p class="note" id="tableEmpty" hidden></p>
      <p class="label rest-h" id="restLabel" data-t="table.rest"></p>
      <ul class="tower" id="restRows"></ul>
      <p class="note"><span data-t="table.note"></span> <button class="link" type="button" data-open="rulesSheet" data-t="profile.rules"></button></p>
    </div>
    <div class="sec sec-play">
      <section class="card play" id="playCard" hidden aria-labelledby="playH">
        <h2 id="playH" data-t="play.card.title"></h2>
        <blockquote id="playQ"></blockquote>
        <div class="play-by"><span class="by" id="playBy"></span><span id="playK"></span></div>
        <p data-t="play.card.p"></p>
      </section>
    </div>
    <div class="sec sec-feed">
      <h2 class="sec-h" data-t="feed.title"></h2>
      <ul class="feed" id="feed"></ul>
      <p class="note" id="feedEmpty" hidden data-t="feed.empty"></p>
      <div class="feed-zero" id="feedZero" hidden><span class="stack" id="feedFaces" aria-hidden="true"></span><p data-t="feed.empty"></p><button class="btn" type="button" id="feedLog" data-t="nav.log"></button></div>
    </div>
  </section>

  <!-- PROFILE -->
  <section class="screen" id="s-profile" hidden aria-labelledby="profileGiant">
    <div class="cols">
      <div class="col-a">
        <div class="hud-row who-row"><span id="portrait"></span><span class="who-tags"><span class="chip"><i class="dot"></i><span id="whoChip"></span></span><span class="chip ghost" id="whoCity"></span></span></div>
        <p class="lead" data-t="profile.lead"></p>
        <h1 class="giant word" id="profileGiant"></h1>
        <div class="lvl" id="lvl"></div>
      </div>
      <div class="col-b">
        <h2 class="sec-h" data-t="profile.badges"></h2>
        <div class="badges" id="badges"></div>
        <h2 class="sec-h" data-t="profile.ledger"></h2>
        <ul class="rows" id="ledger"></ul>
        <p class="note" id="ledgerEmpty" hidden data-t="profile.ledger.empty"></p>
        <button class="link more" type="button" id="ledgerMore" hidden></button>
        <h2 class="sec-h" data-t="profile.settings"></h2>
        <div class="settings" id="settings"></div>
      </div>
    </div>
  </section>

  <!-- MANAGER: THE TEAM -->
  <section class="screen" id="s-team" hidden aria-labelledby="teamGiant">
    <div class="mhero">
      <div class="mh-a">
        <div class="hud-row"><span class="chip"><i class="dot"></i><span id="teamDateChip"></span></span><span class="chip ghost" id="teamSampleChip" hidden data-t="c.sample"></span></div>
        <p class="lead" data-t="mgr.lead"></p>
        <h1 class="giant" id="teamGiant"></h1>
        <p class="support" id="teamSupport"></p>
      </div>
      <div class="wall" id="wall" role="group" data-t-aria="wall.aria"></div>
    </div>
    <div class="blenses" id="teamLenses"></div>
    <div class="hud-row gap"><div class="seg scroll" role="group" id="citySeg" data-t-aria="mgr.filter.aria"></div></div>
    <div class="btable" id="teamTable"></div>
    <p class="note" id="teamEmpty" hidden data-t="mgr.none"></p>
    <h2 class="sec-h" data-t="feed.title"></h2>
    <ul class="feed" id="teamFeed"></ul>
    <p class="note" id="teamFeedEmpty" hidden data-t="feed.empty"></p>
  </section>

  <!-- MANAGER: NEEDS ME -->
  <section class="screen" id="s-needs" hidden aria-labelledby="needsGiant">
    <p class="lead" data-t="needs.lead"></p>
    <h1 class="giant" id="needsGiant"></h1>
    <p class="support" data-t="needs.support"></p>
    <div class="mgr-grid two" id="needsBody"></div>
  </section>

  <!-- MANAGER: REPS -->
  <section class="screen" id="s-reps" hidden aria-labelledby="repsGiant">
    <div class="headrow">
      <div><p class="lead" data-t="reps.lead"></p><h1 class="giant" id="repsGiant"></h1></div>
      <div class="acts"><button class="btn" type="button" id="dayoffBtn" data-t="reps.dayoff"></button> <button class="btn primary" type="button" id="addRepBtn" data-t="reps.add"></button></div>
    </div>
    <div id="repsBody"></div>
  </section>

  <nav class="nav" id="nav" hidden data-t-aria="nav.aria"></nav>
</main>
</div>

<!-- LOG A CONTACT -->
<dialog class="sheet" id="logSheet" aria-labelledby="logH">
  <div class="in">
    <div class="grab" aria-hidden="true"></div>
    <button class="x" type="button" data-close data-t-aria="c.close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
    <h2 id="logH" data-t="log.title"></h2>
    <h3 class="label" data-t="log.step1"></h3>
    <div id="leadPicked" hidden></div>
    <div id="leadPick">
      <label class="field search"><span class="vh" data-t="log.search"></span><input id="leadQ" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="80" data-t-ph="log.search.ph"></label>
      <div class="leads" id="leadOpts"></div>
      <p class="note" id="leadNote" hidden></p>
      <div class="newlead" id="newLead" hidden>
        <label class="field"><span class="label" data-t="log.new.name"></span><input id="newName" type="text" maxlength="120" autocomplete="off"></label>
        <label class="field"><span class="label" data-t="log.new.zone"></span><input id="newZone" type="text" maxlength="80" autocomplete="off"></label>
      </div>
    </div>
    <h3 class="label" data-t="log.step2"></h3>
    <div class="outs" id="outOpts"></div>
    <button class="link more" type="button" id="moreOuts" aria-expanded="false"></button>
    <div id="logExtra" hidden>
      <h3 class="label" data-t="log.step3"></h3>
      <div id="logFields"></div>
    </div>
    <div class="actions"><p class="note hint" id="logHint"></p><button class="btn primary" type="button" id="saveLog" disabled data-t="log.save"></button></div>
  </div>
</dialog>

<!-- CLOSE THE DAY -->
<dialog class="sheet" id="closeSheet" aria-labelledby="clH">
  <div class="in">
    <div class="grab" aria-hidden="true"></div>
    <button class="x" type="button" data-close data-t-aria="c.close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
    <h2 id="clH" data-t="close.sheet.title"></h2>
    <div id="closeFields">
      <label class="field"><span class="label" data-t="close.tomorrow"></span><input id="fTomorrow" type="text" maxlength="280" autocomplete="off" data-t-ph="close.tomorrow.ph"></label>
      <label class="field"><span class="label" data-t="close.blocker"></span><input id="fBlock" type="text" maxlength="280" autocomplete="off" data-t-ph="close.blocker.ph"></label>
    </div>
    <div class="slack" id="slackPrev" data-t-aria="close.preview.aria" role="group" lang="es"><i class="scan" aria-hidden="true"></i><span id="slackText"></span></div>
    <p class="formerr" id="closeErr" role="alert" hidden></p>
    <div class="actions"><button class="btn primary" type="button" id="closeSubmit"></button></div>
    <p class="note" id="closeNote"></p>
  </div>
</dialog>

<!-- WEEKLY GOAL -->
<dialog class="sheet" id="goalSheet" aria-labelledby="goH">
  <div class="in">
    <div class="grab" aria-hidden="true"></div>
    <button class="x" type="button" data-close data-t-aria="c.close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
    <h2 id="goH" data-t="goal.sheet.title"></h2>
    <p class="note" data-t="goal.sheet.note"></p>
    <p class="note" id="goalWhen"></p>
    <div class="leads" id="goalOpts"></div>
  </div>
</dialog>

<!-- HOW YOU EARN -->
<dialog class="sheet" id="rulesSheet" aria-labelledby="ruH">
  <div class="in">
    <div class="grab" aria-hidden="true"></div>
    <button class="x" type="button" data-close data-t-aria="c.close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
    <h2 id="ruH" data-t="rules.title"></h2>
    <ul class="rules" id="rules"></ul>
    <p class="note"><b data-t="rules.hand.b"></b> <span data-t="rules.hand"></span></p>
    <p class="note"><b data-t="rules.streak.b"></b> <span id="rulesStreak"></span></p>
    <p class="note"><b data-t="rules.table.b"></b> <span data-t="rules.table"></span></p>
    <p class="note" data-t="rules.money"></p>
  </div>
</dialog>

<!-- ONE FORM SHEET FOR THE SHORT QUESTIONS -->
<dialog class="sheet" id="formSheet" aria-labelledby="fsH">
  <div class="in">
    <div class="grab" aria-hidden="true"></div>
    <button class="x" type="button" data-close data-t-aria="c.close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
    <h2 id="fsH"></h2>
    <p class="note" id="fsIntro"></p>
    <form id="fsForm" novalidate>
      <div id="fsFields"></div>
      <p class="formerr" id="fsErr" role="alert" hidden></p>
      <div class="actions"><button class="btn primary" type="submit" id="fsBtn"></button><button class="btn" type="button" id="fsSkip" hidden data-close></button></div>
    </form>
    <p class="note" id="fsNote"></p>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><b id="toastP" hidden></b><span id="toastT"></span></div>
<div class="pop" id="pop" role="status" aria-live="polite"></div>
<button class="lockon" type="button" id="lockon" tabindex="-1" aria-hidden="true">
  <span class="lo-box"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
    <svg class="lo-ring" viewBox="0 0 214 214" aria-hidden="true" focusable="false"><g transform="rotate(-70 107 107)"><circle class="a" cx="107" cy="107" r="101"/><g class="tipg"><circle class="tipr" cx="208" cy="107" r="7.5"/><circle class="tipj" cx="208" cy="107" r="7.5"/></g></g></svg>
    <b class="n" id="loN"></b><span class="lo-g" id="loG"></span></span>
  <span class="t"><span id="loA"></span> <em id="loB"></em></span>
  <span class="s" id="loS"></span>
  <span class="label lo-skip" data-t="cel.skip"></span>
</button>
<!-- THE DAY IS COMPLETE: the four habits are done. The screen closes in from where the last one was logged, and
     today's finger lights on the hand, one light after another. -->
<button class="daydone" type="button" id="dayDone" tabindex="-1" aria-hidden="true">
  <span class="dd-in">
    <span class="dd-hand" id="ddHand" aria-hidden="true"></span>
    <span class="giant" id="ddGiant"></span>
    <span class="dd-sub" id="ddSub"></span>
    <span class="dd-go"><span data-t="cel.finger.go"></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-go"/></svg></span>
  </span>
</button>
<!-- THE ENTRANCE: the system finds you before it shows you your day -->
<button class="greet" type="button" id="greet" hidden>
  <span class="g-box vfbox"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><span class="g-lens" id="gLens"></span><i class="g-scan" aria-hidden="true"></i></span>
  <span class="chip g-chip"><i class="dot"></i><span id="gChip"></span></span>
  <span class="lead g-lead" id="gLead"></span>
  <span class="giant g-name" id="gName"></span>
  <span class="support g-line" id="gLine"></span>
  <span class="label g-skip" data-t="greet.skip"></span>
</button>
<noscript><p class="note">Esta app necesita JavaScript. This app needs JavaScript.</p></noscript>
</body>
</html>
